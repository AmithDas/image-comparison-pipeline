<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1172" viewBox="0 0 680 586" role="img">
  <title>Firestore purge pipeline architecture</title>
  <desc>Inside the prod project, the scan metadata table feeds an approved delete list signed off by compliance. A purge Dataflow job reads the approved list, applies safety checks, builds delete requests with an updateTime precondition, and batch-writes deletes to Firestore with throttling. Every outcome is written to a purge log in the restricted audit dataset, and affected collections are exported to a 30-day backup before the run.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .h  { font-size: 16px; font-weight: 500; fill: #2C2C2A; }
      .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
      .p-th { font-size: 14px; font-weight: 500; fill: #3C3489; }
      .p-ts { font-size: 12px; fill: #534AB7; }
      .t-th { font-size: 14px; font-weight: 500; fill: #085041; }
      .t-ts { font-size: 12px; fill: #0F6E56; }
      .box { fill: #FFFFFF; stroke: #B4B2A9; stroke-width: 0.75; }
      .teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.75; }
      .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="586" fill="#FFFFFF"/>
  <text class="h" x="40" y="24" dominant-baseline="central">Firestore purge pipeline — architecture</text>

  <g transform="translate(0,36)">
    <!-- Prod project -->
    <rect x="40" y="20" width="600" height="476" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text class="p-th" x="64" y="50" dominant-baseline="central">Prod project</text>
    <text class="p-ts" x="64" y="70" dominant-baseline="central">Only this job writes to Firestore</text>

    <!-- Audit dataset -->
    <rect class="teal" x="60" y="100" width="380" height="112" rx="12"/>
    <text class="t-th" x="80" y="122" dominant-baseline="central">Audit dataset (restricted)</text>

    <rect class="box" x="80" y="140" width="160" height="56" rx="8"/>
    <text class="th" x="160" y="158" text-anchor="middle" dominant-baseline="central">Scan metadata</text>
    <text class="ts" x="160" y="178" text-anchor="middle" dominant-baseline="central">From scan job</text>

    <rect class="box" x="260" y="140" width="160" height="56" rx="8"/>
    <text class="th" x="340" y="158" text-anchor="middle" dominant-baseline="central">Approved list</text>
    <text class="ts" x="340" y="178" text-anchor="middle" dominant-baseline="central">Signed-off batches</text>

    <line class="arr" x1="240" y1="168" x2="258" y2="168" marker-end="url(#arrow)"/>

    <rect class="box" x="460" y="140" width="160" height="56" rx="8"/>
    <text class="th" x="540" y="158" text-anchor="middle" dominant-baseline="central">Compliance</text>
    <text class="ts" x="540" y="178" text-anchor="middle" dominant-baseline="central">Approves batches</text>

    <line class="arr" x1="460" y1="168" x2="422" y2="168" marker-end="url(#arrow)"/>

    <!-- Purge Dataflow job -->
    <rect x="60" y="250" width="560" height="130" rx="12" fill="none" stroke="#888780" stroke-dasharray="4 3" stroke-width="0.75"/>
    <text class="th" x="600" y="268" text-anchor="end" dominant-baseline="central">Purge Dataflow job</text>
    <text class="ts" x="600" y="286" text-anchor="end" dominant-baseline="central">SA: datastore.user (write)</text>

    <path class="arr" d="M340 196 L340 230 L137 230 L137 301" marker-end="url(#arrow)"/>

    <rect class="box" x="80" y="303" width="115" height="56" rx="8"/>
    <text class="th" x="137" y="321" text-anchor="middle" dominant-baseline="central">Read list</text>
    <text class="ts" x="137" y="341" text-anchor="middle" dominant-baseline="central">BigQueryIO</text>

    <rect class="box" x="215" y="303" width="115" height="56" rx="8"/>
    <text class="th" x="272" y="321" text-anchor="middle" dominant-baseline="central">Guardrails</text>
    <text class="ts" x="272" y="341" text-anchor="middle" dominant-baseline="central">Dry run, caps</text>

    <rect class="box" x="350" y="303" width="115" height="56" rx="8"/>
    <text class="th" x="407" y="321" text-anchor="middle" dominant-baseline="central">Build deletes</text>
    <text class="ts" x="407" y="341" text-anchor="middle" dominant-baseline="central">Precondition</text>

    <rect class="box" x="485" y="303" width="115" height="56" rx="8"/>
    <text class="th" x="542" y="321" text-anchor="middle" dominant-baseline="central">Batch write</text>
    <text class="ts" x="542" y="341" text-anchor="middle" dominant-baseline="central">Throttled, DLQ</text>

    <line class="arr" x1="195" y1="331" x2="213" y2="331" marker-end="url(#arrow)"/>
    <line class="arr" x1="330" y1="331" x2="348" y2="331" marker-end="url(#arrow)"/>
    <line class="arr" x1="465" y1="331" x2="483" y2="331" marker-end="url(#arrow)"/>

    <!-- Outputs -->
    <path class="arr" d="M542 359 L542 398"/>
    <path class="arr" d="M340 398 L542 398"/>
    <line class="arr" x1="340" y1="398" x2="340" y2="418" marker-end="url(#arrow)"/>
    <line class="arr" x1="535" y1="398" x2="535" y2="418" marker-end="url(#arrow)"/>

    <rect class="box" x="60" y="420" width="170" height="56" rx="8"/>
    <text class="th" x="145" y="438" text-anchor="middle" dominant-baseline="central">Backup export</text>
    <text class="ts" x="145" y="458" text-anchor="middle" dominant-baseline="central">Before run, 30-day</text>

    <rect class="box" x="255" y="420" width="170" height="56" rx="8"/>
    <text class="th" x="340" y="438" text-anchor="middle" dominant-baseline="central">Firestore (Native)</text>
    <text class="ts" x="340" y="458" text-anchor="middle" dominant-baseline="central">Delete if unchanged</text>

    <line class="arr" x1="255" y1="448" x2="232" y2="448" marker-end="url(#arrow)"/>

    <rect class="teal" x="450" y="420" width="170" height="56" rx="8"/>
    <text class="t-th" x="535" y="438" text-anchor="middle" dominant-baseline="central">Purge log</text>
    <text class="t-ts" x="535" y="458" text-anchor="middle" dominant-baseline="central">Evidence, kept</text>

    <!-- Legend -->
    <rect x="40" y="516" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text class="ts" x="62" y="523" dominant-baseline="central">Prod project</text>
    <rect x="180" y="516" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text class="ts" x="202" y="523" dominant-baseline="central">Restricted audit dataset</text>
    <rect x="370" y="516" width="14" height="14" rx="3" fill="none" stroke="#888780" stroke-dasharray="4 3" stroke-width="0.75"/>
    <text class="ts" x="392" y="523" dominant-baseline="central">Dataflow job boundary</text>
  </g>
</svg>
