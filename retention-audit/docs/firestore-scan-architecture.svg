<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1220" viewBox="0 0 680 610" role="img">
  <title>Firestore data-age scan architecture</title>
  <desc>Everything runs inside the prod project. A Dataflow batch job reads every Firestore document read-only, partitions and reads them, strips content to metadata, and writes one row per document to a BigQuery table inside a restricted audit dataset with a 30-day expiry. The table feeds audit reports, an old-document list, and a later purge job.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .h  { font-size: 16px; font-weight: 500; fill: #2C2C2A; }
      .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
      .p-th { font-size: 14px; font-weight: 500; fill: #3C3489; }
      .p-ts { font-size: 12px; fill: #534AB7; }
      .t-th { font-size: 14px; font-weight: 500; fill: #085041; }
      .t-ts { font-size: 12px; fill: #0F6E56; }
      .box { fill: #FFFFFF; stroke: #B4B2A9; stroke-width: 0.75; }
      .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
      .bus { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="610" fill="#FFFFFF"/>
  <text class="h" x="40" y="24" dominant-baseline="central">Firestore data-age scan — architecture</text>

  <g transform="translate(0,36)">
    <!-- Prod project -->
    <rect x="40" y="20" width="600" height="496" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text class="p-th" x="64" y="50" dominant-baseline="central">Prod project</text>
    <text class="p-ts" x="64" y="70" dominant-baseline="central">Firestore, Dataflow, audit dataset</text>

    <!-- Firestore -->
    <rect class="box" x="380" y="40" width="240" height="56" rx="8"/>
    <text class="th" x="500" y="58" text-anchor="middle" dominant-baseline="central">Firestore (Native)</text>
    <text class="ts" x="500" y="78" text-anchor="middle" dominant-baseline="central">Read-only, read once</text>

    <!-- Dataflow job -->
    <rect x="60" y="140" width="560" height="118" rx="12" fill="none" stroke="#888780" stroke-dasharray="4 3" stroke-width="0.75"/>
    <text class="th" x="80" y="162" dominant-baseline="central">Dataflow batch job</text>
    <text class="ts" x="600" y="162" text-anchor="end" dominant-baseline="central">SA: datastore.viewer + dataset write</text>

    <path class="arr" d="M500 96 L500 118 L272 118 L272 179" marker-end="url(#arrow)"/>

    <rect class="box" x="80" y="183" width="115" height="56" rx="8"/>
    <text class="th" x="137" y="201" text-anchor="middle" dominant-baseline="central">Partition</text>
    <text class="ts" x="137" y="221" text-anchor="middle" dominant-baseline="central">Split ranges</text>

    <rect class="box" x="215" y="183" width="115" height="56" rx="8"/>
    <text class="th" x="272" y="201" text-anchor="middle" dominant-baseline="central">Read docs</text>
    <text class="ts" x="272" y="221" text-anchor="middle" dominant-baseline="central">RunQuery + QoS</text>

    <rect class="box" x="350" y="183" width="115" height="56" rx="8"/>
    <text class="th" x="407" y="201" text-anchor="middle" dominant-baseline="central">Extract</text>
    <text class="ts" x="407" y="221" text-anchor="middle" dominant-baseline="central">Drop content</text>

    <rect class="box" x="485" y="183" width="115" height="56" rx="8"/>
    <text class="th" x="542" y="201" text-anchor="middle" dominant-baseline="central">Write</text>
    <text class="ts" x="542" y="221" text-anchor="middle" dominant-baseline="central">BigQueryIO</text>

    <line class="arr" x1="195" y1="211" x2="213" y2="211" marker-end="url(#arrow)"/>
    <line class="arr" x1="330" y1="211" x2="348" y2="211" marker-end="url(#arrow)"/>
    <line class="arr" x1="465" y1="211" x2="483" y2="211" marker-end="url(#arrow)"/>

    <!-- Audit dataset -->
    <rect x="60" y="290" width="560" height="110" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text class="t-th" x="80" y="316" dominant-baseline="central">Audit dataset (restricted)</text>
    <text class="t-ts" x="80" y="336" dominant-baseline="central">Audit team only, 30-day expiry</text>

    <line class="arr" x1="542" y1="239" x2="542" y2="320" marker-end="url(#arrow)"/>

    <rect class="box" x="400" y="322" width="200" height="56" rx="8"/>
    <text class="th" x="500" y="340" text-anchor="middle" dominant-baseline="central">BigQuery audit table</text>
    <text class="ts" x="500" y="360" text-anchor="middle" dominant-baseline="central">One row per document</text>

    <!-- Consumers -->
    <path class="bus" d="M500 378 L500 412"/>
    <path class="bus" d="M145 412 L535 412"/>
    <line class="arr" x1="145" y1="412" x2="145" y2="436" marker-end="url(#arrow)"/>
    <line class="arr" x1="340" y1="412" x2="340" y2="436" marker-end="url(#arrow)"/>
    <line class="arr" x1="535" y1="412" x2="535" y2="436" marker-end="url(#arrow)"/>

    <rect class="box" x="60" y="440" width="170" height="56" rx="8"/>
    <text class="th" x="145" y="458" text-anchor="middle" dominant-baseline="central">Audit reports</text>
    <text class="ts" x="145" y="478" text-anchor="middle" dominant-baseline="central">Counts, GB, spikes</text>

    <rect class="box" x="255" y="440" width="170" height="56" rx="8"/>
    <text class="th" x="340" y="458" text-anchor="middle" dominant-baseline="central">Old document list</text>
    <text class="ts" x="340" y="478" text-anchor="middle" dominant-baseline="central">With review flags</text>

    <rect class="box" x="450" y="440" width="170" height="56" rx="8"/>
    <text class="th" x="535" y="458" text-anchor="middle" dominant-baseline="central">Purge job</text>
    <text class="ts" x="535" y="478" text-anchor="middle" dominant-baseline="central">Later, separate job</text>

    <!-- Legend -->
    <rect x="40" y="536" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text class="ts" x="62" y="543" dominant-baseline="central">Prod project</text>
    <rect x="180" y="536" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text class="ts" x="202" y="543" dominant-baseline="central">Restricted audit dataset</text>
    <rect x="370" y="536" width="14" height="14" rx="3" fill="none" stroke="#888780" stroke-dasharray="4 3" stroke-width="0.75"/>
    <text class="ts" x="392" y="543" dominant-baseline="central">Dataflow job boundary</text>
  </g>
</svg>
